<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/><title>L'GROUP | TOP</title><style>
:root{--bg:#fbfaf8;--line:#e4dfd7;--ink:#171717;--sub:#777;--dark:#272622;--gold:#b39a70}
*{box-sizing:border-box}
html,body{margin:0;background:#eceae6;color:var(--ink);font-family:"Yu Gothic","Meiryo",sans-serif}
body.locked{overflow:hidden}
#lock{position:fixed;inset:0;z-index:5000;display:flex;align-items:center;justify-content:center;background:#f4f1eb;padding:20px}
.lock-card{width:min(100%,390px);background:#fbfaf8;border:1px solid #e2dcd2;border-radius:18px;padding:30px 24px 24px;box-shadow:0 18px 60px rgba(0,0,0,.08)}
.lock-logo{display:block;width:160px;max-height:92px;object-fit:contain;margin:0 auto 20px}
.kicker{font:9px Georgia,serif;letter-spacing:.18em;color:#a38c64;text-align:center}
.welcome h1{font:400 34px Georgia,serif;letter-spacing:.05em;text-align:center;margin:8px 0 4px}
.to{font:10px Georgia,serif;letter-spacing:.16em;text-align:center;color:#666}
.form{margin-top:25px} .form label{display:block;font:9px Georgia,serif;letter-spacing:.16em;color:#777;margin-bottom:6px}
.form input{width:100%;border:0;border-bottom:1px solid #aaa39a;background:transparent;padding:10px 0;font-size:18px;outline:0}
.enter{width:100%;height:46px;margin-top:17px;border:0;background:#272622;color:#fff;font:10px Georgia,serif;letter-spacing:.14em}
#error{height:18px;margin-top:7px;text-align:center;color:#a0483e;font-size:10px}
.lock-foot{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);text-align:center;font:8px Georgia,serif;letter-spacing:.15em;color:#888}

#portal{display:none;width:min(100%,430px);min-height:100vh;margin:auto;background:#fbfaf8;box-shadow:0 0 30px rgba(0,0,0,.07)}
#portal.show{display:block}
.common-header{position:sticky;top:0;z-index:1000;background:rgba(251,250,247,.985);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
.head-row{height:58px;padding:4px 14px 3px;display:flex;align-items:center;justify-content:space-between}
.logo-button{display:flex;align-items:center;width:138px;height:48px;padding:0;border:0;background:transparent;overflow:hidden;cursor:pointer}
.logo-button img{width:132px;height:46px;object-fit:contain;object-position:left center;display:block}
.lockout{border:0;background:transparent;color:#8a857d;font:9.5px Georgia,serif;letter-spacing:.08em;padding:10px 2px;cursor:pointer}
.nav-grid,.bottom-nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.nav-grid{padding:3px 14px 7px}
.nav-btn,.bottom-btn{min-height:32px;border:1px solid #ddd8cf;background:#fff;border-radius:8px;color:#706b64;font:9.2px Georgia,serif;letter-spacing:.015em;white-space:nowrap;cursor:pointer}
.nav-btn.active,.bottom-btn.active{background:#272622;color:#fff;border-color:#272622;font-weight:600}

.content-shell{background:#fbfaf8}
#topPage{padding:9px 14px 12px}
.top-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.top-card{padding:0;overflow:hidden;text-align:left;border:1px solid #e3ddd4;background:#fff;border-radius:14px;box-shadow:0 2px 8px rgba(37,30,22,.025);cursor:pointer}
.top-copy{padding:9px 13px 7px;min-height:54px}
.top-copy b{display:block;font:17px Georgia,"Times New Roman",serif;font-weight:400;line-height:1.08;margin-bottom:3px;color:#181716}
.top-copy span{display:block;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:10px;line-height:1.35;color:#514d48}
.top-photo{position:relative;height:75px;background:#eee}
.top-photo img{width:100%;height:100%;object-fit:cover;display:block}

#framewrap{display:none;background:#fbfaf8} iframe{display:block;width:100%;height:300px;border:0;background:#fbfaf8}
.bottom-wrap{display:none;background:#fbfaf8;border-top:1px solid var(--line);padding:12px 14px 10px}
.footer-label{text-align:center;padding:22px 10px 30px;color:#9b958d;font:8px Georgia,serif;letter-spacing:.16em;background:#fbfaf8}
@media(max-height:720px){
 .head-row{height:52px}
 .logo-button{height:43px}
 .logo-button img{height:41px}
 .nav-btn,.bottom-btn{min-height:29px;font-size:8.8px}
 .nav-grid{padding-top:2px;padding-bottom:5px}
 #topPage{padding-top:6px;padding-bottom:8px}
 .top-grid{gap:5px 9px}
 .top-copy{min-height:49px;padding-top:7px;padding-bottom:6px}
 .top-copy b{font-size:16px}
 .top-copy span{font-size:9.6px}
 .top-photo{height:66px}
 }
@media(max-width:360px){
 .head-row{padding-left:11px;padding-right:11px}
 .nav-grid,.bottom-wrap{padding-left:10px;padding-right:10px}
 .nav-btn,.bottom-btn{font-size:8.7px}
 .top-copy b{font-size:16px}
 .top-photo{height:70px}
}
