<!DOCTYPE html>

<html lang="ja"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
<title>L'GROUP | MANUAL</title>
<style>
:root{--bg:#f7f7f5;--paper:#fff;--ink:#171717;--sub:#706d67;--line:#e6e3de;--gold:#aa956e;--soft:#f4f2ed;--dark:#2b2926}
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:var(--ink)}body{font-family:"Yu Gothic","Hiragino Kaku Gothic ProN","Meiryo",sans-serif}
.page{max-width:430px;margin:auto;background:var(--bg);min-height:520px}
main{padding:27px 14px 48px}.pagehead{padding:0 2px 22px}.kicker{font:700 8px Georgia,serif;letter-spacing:.18em;color:#987f55}.pagehead h1{margin:6px 0 0;font:400 31px Georgia,serif;letter-spacing:.02em}.pagehead p{margin:6px 0 0;font-size:11px;color:var(--sub)}
.section{margin-top:4px}.section-title{padding:0 2px 9px;border-bottom:1px solid #ddd9d2}.section-title h2{margin:0;font:400 25px Georgia,serif}.section-title p{margin:4px 0 0;font-size:10px;color:#777}
.manual-list{margin-top:11px;display:grid;gap:10px}.manual-card{padding:16px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 7px 20px rgba(25,25,25,.035)}.manual-card .en{font:700 8px Georgia,serif;letter-spacing:.16em;color:#987f55}.manual-card h3{margin:6px 0 4px;font:500 18px "Yu Mincho","Hiragino Mincho ProN",serif}.manual-card p{margin:0;font-size:10px;line-height:1.7;color:#777}.open{width:100%;height:38px;margin-top:11px;border:1px solid #c9b27d;border-radius:8px;background:#fff;color:#78633c;font-size:10.5px;font-weight:600;letter-spacing:.04em}
.note{margin-top:12px;padding:13px 14px;border:1px dashed #d7d1c5;border-radius:11px;background:#fbfaf8;font-size:10px;line-height:1.7;color:#777}
</style><style>html,body{margin:0!important;min-height:0!important;height:auto!important;overflow-x:hidden!important;background:#fff!important}body{padding:0!important}.page,.shell,.app,.wrap,#portal{min-height:0!important;box-shadow:none!important;margin-left:auto!important;margin-right:auto!important}header,footer{display:none!important}body::after{content:none!important;display:none!important}</style></head>
<body><div class="page"><main>
<div class="pagehead"><div class="kicker">THERAPIST PRIVATE GUIDE</div><h1>MANUAL</h1><p>マニュアル・教材</p></div>
<section class="section"><div class="section-title"><h2>GUIDE LIBRARY</h2><p>教材一覧</p></div>
<div class="manual-list">
<div class="manual-card"><div class="en">NEW THERAPIST GUIDE</div><h3>新人マニュアル</h3><p>教材ページへの入口として使用するカードです。</p><button class="open" type="button">OPEN →</button></div>
<div class="manual-card"><div class="en">KASHIDO</div><h3>稼思動</h3><p>教材ページへの入口として使用するカードです。</p><button class="open" type="button">OPEN →</button></div>
</div>
<div class="note">リンク先・ロック仕様は、教材ページ確定後に接続します。</div>
</section></main></div>
<script>(function(){function r(){parent.postMessage({type:'lg-height',height:document.documentElement.scrollHeight},'*')};addEventListener('load',()=>setTimeout(r,30));if(window.ResizeObserver)new ResizeObserver(()=>requestAnimationFrame(r)).observe(document.documentElement);setTimeout(r,150)})();</script>
<script>(function(){function report(){const h=Math.max(document.documentElement.scrollHeight,document.body.scrollHeight);parent.postMessage({type:'lg-height',height:h},'*')}if(window.ResizeObserver)new ResizeObserver(()=>requestAnimationFrame(report)).observe(document.documentElement);addEventListener('load',()=>setTimeout(report,30));addEventListener('resize',()=>setTimeout(report,30));setTimeout(report,150);setTimeout(report,600)})();</script></body></html>
