<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0d10">
<title>BUSTY OSAKA REVIEW MAKER</title>
<style>
:root{--bg:#0c0d10;--card:#15171c;--line:#30343c;--text:#f6f6f7;--muted:#a5abb4;--red:#a90e31;--red2:#d01948;--ok:#72d69c}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}button,input,select,textarea{font:inherit}button{touch-action:manipulation}.wrap{width:min(100%,620px);margin:auto;padding:14px 12px calc(28px + env(safe-area-inset-bottom))}header{padding:6px 2px 14px}.brand{font-size:21px;font-weight:900}.sub{color:var(--muted);font-size:12px;margin-top:3px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px}.title{font-size:14px;font-weight:850;margin-bottom:12px}.rowhead{display:flex;align-items:center;justify-content:space-between;gap:10px}label{display:block;color:#d5d9df;font-size:12px;font-weight:700;margin:12px 0 6px}select,input,textarea{width:100%;border:1px solid var(--line);background:#0e1014;color:#fff;border-radius:11px;padding:12px;font-size:16px;outline:none}textarea{min-height:78px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{border:0;border-radius:11px;min-height:46px;padding:11px 14px;background:#30343c;color:#fff;font-weight:800;cursor:pointer}.btn.primary{background:var(--red)}.btn.primary:active{background:var(--red2)}.btn.outline{background:transparent;border:1px solid var(--line)}.btn.big{width:100%;min-height:54px;font-size:16px}.btn.small{min-height:34px;padding:7px 10px;font-size:11px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid #3a3f49;background:#101217;color:#e3e6ea;border-radius:999px;padding:10px 12px;font-size:13px;font-weight:750;cursor:pointer}.chip.on{background:var(--red);border-color:var(--red);color:#fff}.group{margin-top:16px}.groupname{font-size:12px;font-weight:850;color:#b9c0c9;margin-bottom:8px}.note{font-size:11px;color:var(--muted);line-height:1.55;margin-top:8px}.profileSummary{font-size:12px;color:var(--muted);margin-top:5px}details summary{list-style:none;cursor:pointer;font-weight:850;font-size:14px;display:flex;justify-content:space-between;align-items:center}details summary::-webkit-details-marker{display:none}details summary:after{content:"＋";font-size:20px;color:#aaa}details[open] summary:after{content:"−"}.actions{display:grid;gap:9px;margin-top:14px}.secondaryActions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}.hidden{display:none!important}.error{background:#35151c;border:1px solid #722337;color:#ffd9e1;padding:10px 12px;border-radius:10px;font-size:12px;line-height:1.5;margin-top:10px}.success{background:#13291d;border:1px solid #245f3b;color:#c9f6da;padding:10px 12px;border-radius:10px;font-size:12px;margin-top:10px}footer{text-align:center;color:#686e77;font-size:10px;padding:6px}@media(max-width:380px){.two,.secondaryActions{grid-template-columns:1fr}.chip{font-size:12px;padding:9px 10px}}
</style></head><body><div class="wrap"><header><div class="brand">BUSTY OSAKA</div><div class="sub">REVIEW MAKER</div></header><section class="card"><div class="title">セラピスト</div><select id="therapist"></select><div id="profileSummary" class="profileSummary"></div></section><section class="card"><details id="profileDetails"><summary>プロフィールを確認・編集</summary><div class="two"><div><label>年齢</label><input id="age" type="number" min="18" placeholder="例：27"></div><div><label>身長</label><input id="height" type="number" placeholder="例：160"></div></div><label>見た目・系統</label><input id="look" placeholder="清楚、可愛い、綺麗系など"><label>体型・スタイル</label><input id="body" placeholder="細身、グラマーなど"><label>肌・髪など</label><input id="appearance" placeholder="色白美肌、さらさらロングなど"><label>性格</label><input id="personality" placeholder="おっとり、明るい、少し天然など"><label>接客の特徴</label><input id="service" placeholder="気遣い、丁寧、話しやすいなど"><label>施術の特徴</label><input id="treatment" placeholder="丁寧、しっかり、ゆったりなど"><label>チャームポイント</label><input id="charm" placeholder="笑顔、えくぼ、お肌など"><label>趣味・好きなこと</label><input id="hobby" placeholder="映画、旅行、ガチャガチャなど"><label>その他</label><textarea id="otherProfile" placeholder="レビュー作成に使える特徴"></textarea><div class="secondaryActions"><button class="btn primary" id="saveProfile">保存</button><button class="btn outline" id="resetProfile">リセット</button></div><div class="note">プロフィールはこの端末のブラウザ内に保存されます。</div></details></section><section class="card"><div class="rowhead"><div><div class="title" style="margin:0">レビューに入れたい要素</div><div class="note" style="margin-top:3px">複数選択できます。レビューは5件固定です。</div></div><button class="btn outline small" id="clearChips">全部解除</button></div><div id="chipArea"></div><label>その他・今回入れたい内容（任意）</label><textarea id="extra" placeholder="ボタンにない内容だけ入力"></textarea></section><section class="card"><div class="title">レビューを作成</div><div class="note">名前と本文は、ChatGPTの回答上でそれぞれ個別にコピーできる形式になるよう指示します。</div><div id="error" class="error hidden"></div><div id="copied" class="success hidden">プロンプトをコピーしました。</div><div class="actions"><button class="btn primary big" id="copyPrompt">レビュー作成プロンプトをコピー</button><button class="btn big hidden" id="openChatGPT">ChatGPTを開く</button><button class="btn outline big" id="openReview">レビュー投稿ページを開く</button></div><div id="destination" class="note"></div></section><footer>REVIEW MAKER / mobile first</footer></div>
<script>
const therapists=[[55,"しおん"],[31,"ゆりか"],[33,"めい"],[63,"りん"],[40,"えま"],[62,"えりか"],[36,"あんず"],[56,"える"],[20,"ここな"],[6,"さくら"],[4,"あいり"],[66,"しゅな"],[64,"みい"],[60,"ほなみ"],[10,"かのん"],[26,"まりり"],[7,"きょうか"],[17,"ふゆ"],[11,"もか"],[44,"くれあ"],[61,"さゆり"],[59,"しずく"],[58,"つむぎ"],[57,"ひまり"],[51,"らいむ"],[34,"りな"],[5,"さき"],[21,"れいな"],[23,"くう"],[27,"れむ"],[25,"かりん"],[29,"らん"],[32,"さつき"],[24,"ゆい"],[8,"いおり"],[45,"まこ"],[46,"あゆ"],[47,"なの"],[35,"あまね"],[9,"すみれ"]];const cats={"見た目":["写真より綺麗","可愛い","スタイル","美肌","清潔感","色気"],"性格・接客":["笑顔","話しやすい","明るい","癒し系","気遣い","聞き上手","親しみやすい","上品"],"施術":["施術が丁寧","施術が上手","経験を感じる","力加減が良い","リラックスできた"],"利用シーン":["初指名","初来店","リピート","仕事帰り","出張","久しぶりの利用","遅い時間"],"次回":["また指名したい","次は長め","リピート確定"]};const fields=["age","height","look","body","appearance","personality","service","treatment","charm","hobby","otherProfile"];const $=id=>document.getElementById(id),therapist=$("therapist");therapists.forEach(([id,n])=>{let o=document.createElement("option");o.value=id;o.textContent=n;therapist.appendChild(o)});therapist.value=localStorage.getItem("busty-last-therapist")||"4";Object.entries(cats).forEach(([n,items])=>{let g=document.createElement("div");g.className="group";g.innerHTML=`<div class="groupname">${n}</div>`;let c=document.createElement("div");c.className="chips";items.forEach(item=>{let b=document.createElement("button");b.type="button";b.className="chip";b.textContent=item;b.dataset.value=item;b.onclick=()=>b.classList.toggle("on");c.appendChild(b)});g.appendChild(c);$("chipArea").appendChild(g)});function profileKey(){return"busty-review-profile-"+therapist.value}function name(){return therapist.options[therapist.selectedIndex].text}function readProfile(){let p={};fields.forEach(f=>p[f]=$(f).value.trim());return p}function loadProfile(){fields.forEach(f=>$(f).value="");let p={};try{p=JSON.parse(localStorage.getItem(profileKey())||"{}")}catch(e){}fields.forEach(f=>$(f).value=p[f]||"");$("profileDetails").open=false;$("error").classList.add("hidden");$("copied").classList.add("hidden");$("openChatGPT").classList.add("hidden");updateSummary()}function updateSummary(){let p=readProfile(),bits=[p.age&&p.age+"歳",p.height&&p.height+"cm",p.look,p.body].filter(Boolean);$("profileSummary").textContent=bits.length?bits.join(" / "):"プロフィール未登録";$("destination").textContent=`投稿先：${name()} 専用レビュー投稿ページ（ID ${therapist.value}）`}function save(){localStorage.setItem(profileKey(),JSON.stringify(readProfile()));updateSummary();$("profileDetails").open=false}function validate(){let p=readProfile(),traits=[p.look,p.body,p.appearance,p.personality,p.service,p.treatment,p.charm,p.hobby,p.otherProfile].filter(Boolean);if(!traits.length){$("error").textContent="プロフィールが未登録です。セラピストの特徴を1項目以上入力して保存してください。";$("error").classList.remove("hidden");$("profileDetails").open=true;return false}$("error").classList.add("hidden");return true}function promptText(){let p=readProfile(),selected=[...document.querySelectorAll(".chip.on")].map(x=>x.dataset.value);return `BUSTY OSAKA「${name()}」について、お客様が投稿した体裁のレビュー案を5件作成してください。\n\n【セラピスト情報】\n名前：${name()}\n年齢：${p.age?p.age+"歳":"未入力"}\n身長：${p.height?p.height+"cm":"未入力"}\n見た目・系統：${p.look||"未入力"}\n体型・スタイル：${p.body||"未入力"}\n肌・髪など：${p.appearance||"未入力"}\n性格：${p.personality||"未入力"}\n接客：${p.service||"未入力"}\n施術：${p.treatment||"未入力"}\nチャームポイント：${p.charm||"未入力"}\n趣味：${p.hobby||"未入力"}\nその他：${p.otherProfile||"なし"}\n\n【今回使いたい要素】\n${selected.length?selected.join("、"):"指定なし"}\n追加情報：${$("extra").value.trim()||"なし"}\n\n【作成ルール】\n・必ず5件作成する。\n・5件すべて、別のお客様が書いたようにする。\n・お客様名は、偽名・仮名・イニシャル・あだ名・匿名系などを混ぜる。\n・電話番号、利用日時、利用コースは生成しない。\n・客の設定、利用理由、着眼点、語彙、文体、文章構成をレビューごとに変える。\n・文章量は、超短文・短文・普通・長文を混在させ、5件の長さを揃えない。\n・導入、語尾、締め方を揃えない。締めの一文がないレビューも混ぜる。\n・選択された特徴を5件すべてに詰め込まず、レビューごとに自然に分散する。\n・セラピスト情報にない具体的事実を勝手に追加しない。\n・同じ言い回し、同じ褒め方、同じ展開の焼き直しを避ける。\n\n【重要：出力形式】\n各レビューを1〜5の番号順に出力する。\n各レビューでは「お客様名」と「レビュー本文」を必ず別々のMarkdownコードブロックにする。\nコードブロック内にはラベルや説明を入れず、コピーしてそのまま投稿フォームへ貼れる内容だけを入れる。\n\n例：\n### 1\nお客様名\n\`\`\`\nたか\n\`\`\`\n\nレビュー本文\n\`\`\`\nここにレビュー本文\n\`\`\`\n\nこの形式を5件すべてで厳守してください。`}async function copyPrompt(){if(!validate())return;save();let text=promptText();try{await navigator.clipboard.writeText(text)}catch(e){let ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove()}$("copied").classList.remove("hidden");$("openChatGPT").classList.remove("hidden");setTimeout(()=>$("copied").classList.add("hidden"),2500)}therapist.onchange=()=>{localStorage.setItem("busty-last-therapist",therapist.value);loadProfile()};$("saveProfile").onclick=save;$("resetProfile").onclick=()=>{if(confirm(`${name()}の保存プロフィールを削除しますか？`)){localStorage.removeItem(profileKey());loadProfile()}};$("clearChips").onclick=()=>document.querySelectorAll(".chip.on").forEach(x=>x.classList.remove("on"));$("copyPrompt").onclick=copyPrompt;$("openChatGPT").onclick=()=>window.open("https://chatgpt.com/","_blank","noopener");$("openReview").onclick=()=>window.open("https://www.busty-osaka.com/post_review.php?id="+therapist.value,"_blank","noopener");loadProfile();
</script></body></html>
