<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0d10">
<title>Un Secret REVIEW MAKER</title>
<style>
:root{--bg:#0c0d10;--card:#15171c;--line:#30343c;--text:#f6f6f7;--muted:#a5abb4;--red:#a90e31;--red2:#d01948;--ok:#72d69c}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}button,input,select,textarea{font:inherit}button{touch-action:manipulation}.wrap{width:min(100%,620px);margin:auto;padding:14px 12px calc(28px + env(safe-area-inset-bottom))}header{padding:6px 2px 14px}.brand{font-size:21px;font-weight:900}.sub{color:var(--muted);font-size:12px;margin-top:3px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px}.title{font-size:14px;font-weight:850;margin-bottom:12px}.rowhead{display:flex;align-items:center;justify-content:space-between;gap:10px}label{display:block;color:#d5d9df;font-size:12px;font-weight:700;margin:12px 0 6px}select,input,textarea{width:100%;border:1px solid var(--line);background:#0e1014;color:#fff;border-radius:11px;padding:12px;font-size:16px;outline:none}textarea{min-height:78px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{border:0;border-radius:11px;min-height:46px;padding:11px 14px;background:#30343c;color:#fff;font-weight:800;cursor:pointer}.btn.primary{background:var(--red)}.btn.primary:active{background:var(--red2)}.btn.outline{background:transparent;border:1px solid var(--line)}.btn.big{width:100%;min-height:54px;font-size:16px}.btn.small{min-height:34px;padding:7px 10px;font-size:11px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid #3a3f49;background:#101217;color:#e3e6ea;border-radius:999px;padding:10px 12px;font-size:13px;font-weight:750;cursor:pointer}.chip.on{background:var(--red);border-color:var(--red);color:#fff}.group{margin-top:16px}.groupname{font-size:12px;font-weight:850;color:#b9c0c9;margin-bottom:8px}.note{font-size:11px;color:var(--muted);line-height:1.55;margin-top:8px}.profileSummary{font-size:12px;color:var(--muted);margin-top:5px}details summary{list-style:none;cursor:pointer;font-weight:850;font-size:14px;display:flex;justify-content:space-between;align-items:center}details summary::-webkit-details-marker{display:none}details summary:after{content:"＋";font-size:20px;color:#aaa}details[open] summary:after{content:"−"}.actions{display:grid;gap:9px;margin-top:14px}.secondaryActions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}.hidden{display:none!important}.error{background:#35151c;border:1px solid #722337;color:#ffd9e1;padding:10px 12px;border-radius:10px;font-size:12px;line-height:1.5;margin-top:10px}.success{background:#13291d;border:1px solid #245f3b;color:#c9f6da;padding:10px 12px;border-radius:10px;font-size:12px;margin-top:10px}footer{text-align:center;color:#686e77;font-size:10px;padding:6px}@media(max-width:380px){.two,.secondaryActions{grid-template-columns:1fr}.chip{font-size:12px;padding:9px 10px}}
</style></head><body><div class="wrap"><header><div class="brand">Un Secret</div><div class="sub">REVIEW MAKER</div></header><section class="card"><div class="title">セラピスト</div><select id="therapist"></select><div id="profileSummary" class="profileSummary"></div></section><section class="card"><details id="profileDetails"><summary>プロフィールを確認・編集</summary><div class="two"><div><label>年齢</label><input id="age" type="number" min="18" placeholder="例：27"></div><div><label>身長</label><input id="height" type="number" placeholder="例：160"></div></div><label>見た目・系統</label><input id="look" placeholder="清楚、可愛い、綺麗系など"><label>体型・スタイル</label><input id="body" placeholder="細身、グラマーなど"><label>肌・髪など</label><input id="appearance" placeholder="色白美肌、さらさらロングなど"><label>性格</label><input id="personality" placeholder="おっとり、明るい、少し天然など"><label>接客の特徴</label><input id="service" placeholder="気遣い、丁寧、話しやすいなど"><label>施術の特徴</label><input id="treatment" placeholder="丁寧、しっかり、ゆったりなど"><label>チャームポイント</label><input id="charm" placeholder="笑顔、えくぼ、お肌など"><label>趣味・好きなこと</label><input id="hobby" placeholder="映画、旅行、ガチャガチャなど"><label>その他</label><textarea id="otherProfile" placeholder="レビュー作成に使える特徴"></textarea><div class="secondaryActions"><button class="btn primary" id="saveProfile">保存</button><button class="btn outline" id="resetProfile">リセット</button></div><div class="note">プロフィールはこの端末のブラウザ内に保存されます。</div></details></section><section class="card"><div class="rowhead"><div><div class="title" style="margin:0">レビューに入れたい要素</div><div class="note" style="margin-top:3px">複数選択できます。実際に寄せられた感想を基に文章を整えます。</div></div><button class="btn outline small" id="clearChips">全部解除</button></div><div id="chipArea"></div><label>お客様から実際に寄せられた感想（必須）</label><textarea id="extra" placeholder="お客様が実際に話した・記入した内容を入力してください"></textarea></section><section class="card"><div class="title">レビューを作成</div><div class="note">お客様から受け取った実際の感想を、事実を変えずに読みやすく整えるプロンプトを作成します。</div><div id="error" class="error hidden"></div><div id="copied" class="success hidden">プロンプトをコピーしました。</div><div class="actions"><button class="btn primary big" id="copyPrompt">レビュー作成プロンプトをコピー</button><button class="btn big hidden" id="openChatGPT">ChatGPTを開く</button><button class="btn outline big" id="openReview">レビュー投稿ページを開く</button></div><div id="destination" class="note"></div></section><footer>REVIEW MAKER / mobile first</footer></div>
<script>
const therapists=[[1,"しほ"],[2,"すみれ"],[3,"ももな"],[4,"つき"],[5,"あいす"],[6,"める"],[7,"ゆな"],[8,"みかな"],[9,"みり"],[10,"りの"],[11,"りな"],[12,"むく"],[13,"つばさ"],[14,"さな"],[15,"こゆ"],[16,"きら"],[17,"ひなの"],[18,"ことり"],[19,"こと"],[20,"らむ"],[21,"いろ"],[22,"かのん"],[23,"なぎさ"],[24,"きき"],[25,"ちとせ"],[26,"ゆい"],[27,"ゆう"],[28,"みさき"],[29,"りら"],[30,"りむ"],[31,"りぜ"],[32,"れもん"],[33,"みみ"],[34,"まる"],[35,"おる"],[36,"ちょこ"],[37,"おと"],[38,"あやめ"],[39,"あかり"],[40,"らら"],[41,"かなの"],[42,"みりあ"],[43,"いちご"],[44,"かれん"],[45,"れん"],[46,"ゆゆ"],[47,"える"],[48,"りさ"],[49,"りこ"],[50,"さくら"],[51,"はな"],[52,"せいは"],[53,"もえか"],[54,"みるく"],[55,"ねね"],[56,"すばる"],[57,"なつき"],[58,"ゆら"],[59,"すず"],[60,"なる"],[61,"さき"],[62,"うみ"],[63,"れいな"],[64,"ほの"],[65,"りか"],[66,"うさ"],[67,"みか"],[68,"こはく"],[69,"ぷりん"]];const cats={"見た目":["写真より綺麗","可愛い","スタイル","美肌","清潔感","色気"],"性格・接客":["笑顔","話しやすい","明るい","癒し系","気遣い","聞き上手","親しみやすい","上品"],"施術":["施術が丁寧","施術が上手","経験を感じる","力加減が良い","リラックスできた"],"利用シーン":["初指名","初来店","リピート","仕事帰り","出張","久しぶりの利用","遅い時間"],"次回":["また指名したい","次は長め","リピート確定"]};const fields=["age","height","look","body","appearance","personality","service","treatment","charm","hobby","otherProfile"];const $=id=>document.getElementById(id),therapist=$("therapist");therapists.forEach(([id,n])=>{let o=document.createElement("option");o.value=id;o.textContent=n;therapist.appendChild(o)});therapist.value=localStorage.getItem("unsecret-last-therapist")||"1";Object.entries(cats).forEach(([n,items])=>{let g=document.createElement("div");g.className="group";g.innerHTML=`<div class="groupname">${n}</div>`;let c=document.createElement("div");c.className="chips";items.forEach(item=>{let b=document.createElement("button");b.type="button";b.className="chip";b.textContent=item;b.dataset.value=item;b.onclick=()=>b.classList.toggle("on");c.appendChild(b)});g.appendChild(c);$("chipArea").appendChild(g)});function profileKey(){return"unsecret-review-profile-"+therapist.value}function name(){return therapist.options[therapist.selectedIndex].text}function readProfile(){let p={};fields.forEach(f=>p[f]=$(f).value.trim());return p}function loadProfile(){fields.forEach(f=>$(f).value="");let p={};try{p=JSON.parse(localStorage.getItem(profileKey())||"{}")}catch(e){}fields.forEach(f=>$(f).value=p[f]||"");$("profileDetails").open=false;$("error").classList.add("hidden");$("copied").classList.add("hidden");$("openChatGPT").classList.add("hidden");updateSummary()}function updateSummary(){let p=readProfile(),bits=[p.age&&p.age+"歳",p.height&&p.height+"cm",p.look,p.body].filter(Boolean);$("profileSummary").textContent=bits.length?bits.join(" / "):"プロフィール未登録";$("destination").textContent=`投稿先：Un Secret公式レビュー投稿フォーム（担当セラピストは投稿先で選択）`}function save(){localStorage.setItem(profileKey(),JSON.stringify(readProfile()));updateSummary();$("profileDetails").open=false}function validate(){let p=readProfile(),traits=[p.look,p.body,p.appearance,p.personality,p.service,p.treatment,p.charm,p.hobby,p.otherProfile].filter(Boolean);if(!traits.length){$("error").textContent="プロフィールが未登録です。セラピストの特徴を1項目以上入力して保存してください。";$("error").classList.remove("hidden");$("profileDetails").open=true;return false}$("error").classList.add("hidden");return true}function promptText(){let p=readProfile(),selected=[...document.querySelectorAll(".chip.on")].map(x=>x.dataset.value);return `Un Secret「${name()}」について、実際にお客様から寄せられた感想の文章校正をしてください。

【セラピスト情報】
名前：${name()}
年齢：${p.age?p.age+"歳":"未入力"}
身長：${p.height?p.height+"cm":"未入力"}
見た目・系統：${p.look||"未入力"}
体型・スタイル：${p.body||"未入力"}
肌・髪など：${p.appearance||"未入力"}
性格：${p.personality||"未入力"}
接客：${p.service||"未入力"}
施術：${p.treatment||"未入力"}
チャームポイント：${p.charm||"未入力"}
その他：${p.otherProfile||"なし"}

【確認したい要素】
${selected.join("、")||"指定なし"}

【お客様から寄せられた実際の感想】
${$("extra").value.trim()}

【作成ルール】
・実際の感想にある事実・評価・ニュアンスを保つ。
・未確認の施術内容、日時、利用コース、感情、体験を追加しない。
・存在しないお客様名・投稿者を作らない。
・文章を読みやすく整えた案を1件作成する。
・修正した点が分かるように簡潔に説明する。
・本人の同意を得た上で使用する。`}async function copyPrompt(){if(!validate())return;if(!$("extra").value.trim()){$("error").textContent="実際のお客様の感想を入力してください。";$("error").classList.remove("hidden");return}save();let text=promptText();try{await navigator.clipboard.writeText(text)}catch(e){let ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove()}$("copied").classList.remove("hidden");$("openChatGPT").classList.remove("hidden");setTimeout(()=>$("copied").classList.add("hidden"),2500)}therapist.onchange=()=>{localStorage.setItem("unsecret-last-therapist",therapist.value);loadProfile()};$("saveProfile").onclick=save;$("resetProfile").onclick=()=>{if(confirm(`${name()}の保存プロフィールを削除しますか？`)){localStorage.removeItem(profileKey());loadProfile()}};$("clearChips").onclick=()=>document.querySelectorAll(".chip.on").forEach(x=>x.classList.remove("on"));$("copyPrompt").onclick=copyPrompt;$("openChatGPT").onclick=()=>window.open("https://chatgpt.com/","_blank","noopener");$("openReview").onclick=()=>window.open("https://www.unsecret-osaka.com/post_review.php?id="+therapist.value,"_blank","noopener");loadProfile();
</script></body></html>
