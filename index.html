<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>L'GROUP | PRIVATE GUIDE</title>
<style>
:root{--gold:#b39a70;--navy:#0e2134;--cream:#faf7f1}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#eceae6;color:#171717;font-family:"Yu Gothic","Meiryo",sans-serif}
body{min-height:100dvh;overflow:hidden}
#lock{position:fixed;inset:0;z-index:5000;min-height:100dvh;overflow:auto;display:flex;align-items:center;justify-content:center;padding:34px 20px;background:radial-gradient(circle at 50% 14%,rgba(255,255,255,.96) 0 9%,rgba(255,255,255,0) 32%),linear-gradient(112deg,#0c1723 0 18%,#172536 18% 27%,#e8e1d6 27% 73%,#152333 73% 82%,#07111c 82% 100%);isolation:isolate}
#lock::before{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(90deg,transparent 0 18%,rgba(197,164,103,.32) 18.05% 18.13%,transparent 18.18% 81.82%,rgba(197,164,103,.25) 81.87% 81.95%,transparent 82%),linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.12));pointer-events:none}
#lock::after{content:"";position:absolute;z-index:-1;left:0;right:0;bottom:0;height:25%;opacity:.48;background:linear-gradient(176deg,transparent 0 45%,rgba(255,255,255,.35) 45.2% 45.8%,transparent 46%),linear-gradient(12deg,transparent 0 60%,rgba(255,255,255,.22) 60.2% 60.8%,transparent 61%),linear-gradient(90deg,#b9b0a4,#e8e2d9 45%,#9d958c);box-shadow:0 -18px 50px rgba(0,0,0,.14)}
.lock-shell{position:relative;width:min(100%,960px);min-height:min(760px,calc(100dvh - 68px));display:grid;grid-template-columns:minmax(150px,.68fr) minmax(330px,1.55fr) minmax(150px,.68fr);align-items:center}
.lock-side{align-self:stretch;display:flex;flex-direction:column;justify-content:space-between;padding:52px 26px;color:#d9bd83;font-family:Georgia,"Times New Roman",serif}
.lock-side-copy{font-size:18px;line-height:1.62;letter-spacing:.14em}
.lock-side-copy::after{content:"";display:block;width:54px;height:1px;margin-top:26px;background:#c8a765}
.lock-side-ja{margin-top:18px;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:11px;line-height:1.9;letter-spacing:.08em;color:#d9c49a}
.lock-restricted{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:11px;letter-spacing:.13em;text-align:right;color:#d9bd83}
.lock-restricted::before{content:"◆";font-size:7px;margin-right:8px}
.lock-closing{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:13px;line-height:1.9;letter-spacing:.08em;color:#f0e5d0;text-align:right}
.lock-closing small{display:block;margin-top:12px;font-family:Georgia,"Times New Roman",serif;font-size:8px;letter-spacing:.18em;color:#c9ad77}
.lock-card{position:relative;width:100%;min-height:610px;display:flex;flex-direction:column;justify-content:center;padding:56px 46px 48px;background:rgba(250,247,241,.94);border:1px solid rgba(255,255,255,.72);border-radius:2px;box-shadow:0 28px 80px rgba(0,0,0,.24);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.lock-card::before{content:"";position:absolute;inset:14px;border:1px solid rgba(177,145,91,.18);pointer-events:none}
.lock-brand{position:relative;text-align:center;z-index:1}
.lock-logo{display:block;width:188px;height:118px;object-fit:contain;margin:0 auto 10px;filter:sepia(.45) saturate(.75) brightness(.78)}
.lock-brand-name{font:400 26px Georgia,"Times New Roman",serif;letter-spacing:.19em;color:#9a7a47;margin:0 0 20px}
.lock-divider{width:40px;height:1px;margin:0 auto 21px;background:#ad8a52}
.lock-portal{font:10px Georgia,"Times New Roman",serif;letter-spacing:.36em;color:#65636a}
.lock-portal-ja{margin-top:8px;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:12px;letter-spacing:.14em;color:#77716b}
.form{position:relative;z-index:1;margin-top:34px}
.form label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.password-wrap{position:relative}
.password-wrap::before{content:"◇";position:absolute;left:18px;top:50%;transform:translateY(-50%);color:#a8864f;font-size:16px}
.form input{width:100%;height:58px;border:1px solid rgba(164,145,116,.48);border-radius:9px;background:rgba(255,255,255,.72);padding:0 18px 0 48px;color:#292725;font-family:"Yu Gothic","Meiryo",sans-serif;font-size:15px;text-align:center;letter-spacing:.08em;outline:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.85)}
.form input:focus{border-color:#ad8a52;box-shadow:0 0 0 3px rgba(173,138,82,.10)}
.form input::placeholder{color:#9a938b;letter-spacing:.08em}
.enter{width:100%;height:58px;margin-top:16px;border:1px solid #b3945f;border-radius:29px;background:#0e2134;color:#f4dfb4;font:11px Georgia,"Times New Roman",serif;letter-spacing:.25em;cursor:pointer;box-shadow:0 13px 28px rgba(8,20,33,.22);transition:transform .15s ease,background .15s ease}
.enter:hover{background:#142b42}.enter:active{transform:translateY(1px)}
#error{min-height:22px;margin-top:9px;text-align:center;color:#9b463d;font-size:11px}
.lock-note{position:relative;z-index:1;margin-top:17px;text-align:center;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:10px;line-height:1.75;letter-spacing:.07em;color:#77716b}
.lock-foot{position:relative;z-index:1;margin-top:25px;padding-top:16px;border-top:1px solid rgba(173,138,82,.20);text-align:center;font:8px Georgia,"Times New Roman",serif;letter-spacing:.18em;color:#9a825b}
.lock-mobile-top,.lock-mobile-bottom{display:none}
@media(max-width:720px){#lock{align-items:flex-start;padding:20px 16px 30px;background:radial-gradient(circle at 50% 7%,rgba(255,255,255,.95) 0 8%,rgba(255,255,255,0) 27%),linear-gradient(107deg,#0a1724 0 8%,#152436 8% 15%,#e8e1d6 15% 85%,#142334 85% 92%,#07111c 92% 100%)}.lock-shell{display:block;width:min(100%,430px);min-height:auto;padding:42px 0 62px}.lock-side{display:none}.lock-card{min-height:0;padding:46px 24px 34px;border-radius:2px}.lock-logo{width:156px;height:98px;margin-bottom:5px}.lock-brand-name{font-size:22px;margin-bottom:17px}.lock-portal{font-size:9px;letter-spacing:.30em}.lock-portal-ja{font-size:11px}.form{margin-top:28px}.form input,.enter{height:54px}.lock-mobile-top{display:block;margin-bottom:16px;text-align:right;color:#d7bd8a;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:10px;letter-spacing:.12em}.lock-mobile-bottom{display:block;margin-top:24px;text-align:center;color:#e8d7b6;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:11px;line-height:1.8;letter-spacing:.08em}}
</style>
</head>
<body>
<section id="lock">
  <div class="lock-shell">
    <aside class="lock-side" aria-hidden="true">
      <div>
        <div class="lock-side-copy">PEOPLE<br>CREATE<br>THE NEXT<br>STANDARD.</div>
        <div class="lock-side-ja">人が、<br>次のスタンダードをつくる。</div>
      </div>
      <div></div>
    </aside>
    <div>
      <div class="lock-mobile-top">社内・関係者専用</div>
      <div class="lock-card">
        <div class="lock-brand">
          <img class="lock-logo" src="images/lgroup-logo.webp" alt="L'GROUP">
          <div class="lock-brand-name">L'GROUP</div>
          <div class="lock-divider"></div>
          <div class="lock-portal">PRIVATE GUIDE</div>
          <div class="lock-portal-ja">関係者専用ポータル</div>
        </div>
        <form class="form" id="login" autocomplete="off">
          <label for="pw">暗証番号</label>
          <div class="password-wrap"><input id="pw" type="password" inputmode="numeric" maxlength="4" placeholder="暗証番号を入力" autofocus></div>
          <button class="enter" type="submit">ENTER</button>
          <div id="error" aria-live="polite"></div>
        </form>
        <div class="lock-note">このサイトは L'GROUP の社内・関係者専用です。<br>許可された方のみご利用ください。</div>
        <div class="lock-foot">L'GROUP PRIVATE ACCESS</div>
      </div>
      <div class="lock-mobile-bottom">BEAUTY FOR A BETTER TOMORROW</div>
    </div>
    <aside class="lock-side" aria-hidden="true">
      <div class="lock-restricted">RESTRICTED ACCESS</div>
      <div class="lock-closing">美しい明日を、共に。<small>BEAUTY FOR A BETTER TOMORROW</small></div>
    </aside>
  </div>
</section>
<script>
(function(){
  var AUTH_KEY='lg-auth-v2', IDLE_KEY='lg-auth-v2-last', IDLE_MS=60*60*1000;
  function valid(){var last=Number(sessionStorage.getItem(IDLE_KEY)||0);return sessionStorage.getItem(AUTH_KEY)==='1'&&last>0&&(Date.now()-last)<IDLE_MS}
  function go(){location.replace('00_TOP_REVISED_NO_DUP_ARROW.html')}
  if(valid()){sessionStorage.setItem(IDLE_KEY,String(Date.now()));go();return}
  sessionStorage.removeItem(AUTH_KEY);sessionStorage.removeItem(IDLE_KEY);
  document.getElementById('login').addEventListener('submit',function(e){
    e.preventDefault();
    var pw=document.getElementById('pw').value;
    if(pw==='2525'){
      document.getElementById('error').textContent='';
      sessionStorage.setItem(AUTH_KEY,'1');
      sessionStorage.setItem(IDLE_KEY,String(Date.now()));
      go();
    }else{
      document.getElementById('error').textContent='暗証番号が違います。';
      document.getElementById('pw').select();
    }
  });
})();
</script>
</body>
</html>
